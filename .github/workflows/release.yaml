name: Build reviewed release images
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24.19.0'}
      - run: ./gradlew build --no-daemon
      - name: Build component images
        shell: bash
        run: |
          set -euo pipefail
          for component in control-plane workflow-worker http-runner result-processor notification-worker; do
            docker build -f deploy/Dockerfile --build-arg "COMPONENT=$component" -t "heimdall/$component:$GITHUB_SHA" .
          done
          docker build -f components/script-runner/Dockerfile.service -t "heimdall/script-service:$GITHUB_SHA" components/script-runner
