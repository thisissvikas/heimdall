version: '3.8'
x-java: &java
  restart: unless-stopped
  environment: &environment
    JDBC_URL: jdbc:postgresql://postgres:5432/heimdall
    DB_USER: heimdall
    DB_PASSWORD: heimdall-local
    TEMPORAL_ADDRESS: temporal:7233
    KAFKA_BOOTSTRAP: kafka:9092
    STATE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    AWS_ACCESS_KEY_ID: fixture
    AWS_SECRET_ACCESS_KEY: fixture
    AWS_REGION: us-east-1
    S3_ENDPOINT: http://storage:4566
    S3_BUCKET: heimdall
  depends_on:
    postgres: {condition: service_healthy}
    temporal: {condition: service_healthy}
    kafka: {condition: service_healthy}
services:
  postgres:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: heimdall, POSTGRES_USER: heimdall, POSTGRES_PASSWORD: heimdall-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U heimdall"], interval: 3s, timeout: 2s, retries: 30}
  temporal:
    image: temporalio/temporal:1.9.1
    user: '0:0'
    command: [server, start-dev, --ip, 0.0.0.0, --db-filename, /data/temporal.db]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal:/data"]
    healthcheck: {test: [CMD, temporal, --address, localhost:7233, operator, cluster, health], interval: 3s, timeout: 3s, retries: 40}
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck: {test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 5s, timeout: 10s, retries: 30}
  vault:
    image: hashicorp/vault:1.19.5
    command: [server, -dev, -dev-listen-address=0.0.0.0:8200]
    environment: {VAULT_DEV_ROOT_TOKEN_ID: fixture-vault-root}
    cap_add: [IPC_LOCK]
    ports: ["127.0.0.1:8200:8200"]
  storage:
    image: localstack/localstack:4
    environment: {SERVICES: s3, AWS_DEFAULT_REGION: us-east-1}
    volumes: ["./storage-init.sh:/etc/localstack/init/ready.d/storage-init.sh:ro"]
  fixture:
    build: {context: ../../tests/fixtures}
    ports: ["127.0.0.1:8090:8090"]
  control-plane:
    <<: *java
    build: {context: ../.., dockerfile: deploy/Dockerfile, args: {COMPONENT: control-plane}}
    environment:
      <<: *environment
      SPRING_PROFILES_ACTIVE: local
      HEIMDALL_LOCAL_ROOT: /repository
      HEIMDALL_LOCAL_AUTH_TOKENS: '{"fixture-runner-token":"dev-runner","fixture-viewer-token":"dev-viewer","fixture-admin-token":"dev-admin"}'
      GITHUB_WEBHOOK_SECRET: fixture-webhook-secret
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["../../config:/repository/config:ro", "../../.github/CODEOWNERS:/repository/.github/CODEOWNERS:ro"]
  workflow-worker:
    <<: *java
    build: {context: ../.., dockerfile: deploy/Dockerfile, args: {COMPONENT: workflow-worker}}
  http-runner:
    <<: *java
    build: {context: ../.., dockerfile: deploy/Dockerfile, args: {COMPONENT: http-runner}}
    environment:
      <<: *environment
      LOCATION: local
      VAULT_ADDRESS: http://vault:8200
      VAULT_TOKEN: fixture-vault-root
      SCRIPT_ENDPOINT: http://script-runner:8081
    depends_on:
      control-plane: {condition: service_started}
      script-runner: {condition: service_started}
      vault: {condition: service_started}
  script-runner:
    build: {context: ../../components/script-runner, dockerfile: Dockerfile.service}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 32
  result-processor:
    <<: *java
    build: {context: ../.., dockerfile: deploy/Dockerfile, args: {COMPONENT: result-processor}}
  notification-worker:
    <<: *java
    build: {context: ../.., dockerfile: deploy/Dockerfile, args: {COMPONENT: notification-worker}}
    environment:
      <<: *environment
      NOTIFICATION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NOTIFICATION_DESTINATIONS: '{}'
volumes: {postgres: {}, temporal: {}}
