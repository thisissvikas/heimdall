[versions]
boot = "4.1.1"
jackson = "2.20.1"
temporal = "1.36.0"
okhttp = "4.12.0"
yaml = "2.5"
cel = "0.14.0"
jsonpath = "2.9.0"
schema = "1.5.9"
junit = "6.0.3"
testcontainers = "1.21.3"
shedlock = "7.10.1"
aws = "2.31.78"
spotless = "8.10.3"
google-java-format = "1.36.1"

[libraries]
jackson = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-time = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
temporal = { module = "io.temporal:temporal-sdk", version.ref = "temporal" }
temporal-testing = { module = "io.temporal:temporal-testing", version.ref = "temporal" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
yaml = { module = "org.yaml:snakeyaml", version.ref = "yaml" }
cel = { module = "dev.cel:cel", version.ref = "cel" }
jsonpath = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonpath" }
schema = { module = "com.networknt:json-schema-validator", version.ref = "schema" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-jdbc = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws" }

[plugins]
boot = { id = "org.springframework.boot", version.ref = "boot" }
